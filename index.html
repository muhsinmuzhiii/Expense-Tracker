<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="masthead-top">
      <div>

        <h1>Expense Tracker</h1>
        <p>Record it, categorize it, know where it went.</p>
      </div>
      <div class="toolbar">
        
        
        
      </div>
    </div>
  </div>

  <div class="quote-strip" id="quote-strip">Loading a thought for the day…</div>

  <!-- Add Expense -->
  <div class="sheet">
    <h2 class="section-title">new entry</h2>
    <form id="expense-form" novalidate>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Groceries">
      </div>
      <div class="field">
        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01">
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category">
          <option value="">Select…</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date">
      </div>
      <button type="submit" id="submit-btn">Add Expense</button>
      <button type="button" id="cancel-edit-btn" style="display:none;">Cancel</button>
    </form>
    <p class="error-msg" id="error-msg"></p>
  </div>



  <!-- Filter / Search / Sort -->
  <div class="sheet">
    <h2 class="section-title">browse entries</h2>
    <div class="controls-row">
      <div class="field">
        <label for="search-box">Search by title</label>
        <input type="text" id="search-box" placeholder="Type to search…">
      </div>
      <div class="field">
        <label for="category-filter">Category</label>
        <select id="category-filter">
          <option value="All">All</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label for="sort-select">Sort by</label>
        <select id="sort-select">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="highest">Highest Amount</option>
          <option value="lowest">Lowest Amount</option>
        </select>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Category</th>
          <th>Date</th>
          <th>Amount</th>
          <th></th>
        </tr>
      </thead>
      
      <tbody id="expense-body">
        <tr class="empty-row"><td colspan="5">No expenses yet — add your first one above.</td></tr>
      </tbody>
      
    </table>
    
  </div>
    <!-- Summary -->
  <div class="sheet">
    <h2 class="section-title">summary</h2>
    <div class="summary-grid">
      <div class="stat">
        <div class="label">total spent</div>
        <div class="value" id="stat-total">₹0.00</div>
      </div>
      <div class="stat">
        <div class="label">no. of expenses</div>
        <div class="value" id="stat-count">0</div>
      </div>
      <div class="stat">
        <div class="label">highest expense</div>
        <div class="value" id="stat-highest">₹0.00</div>
      </div>
      <div class="stat">
        <div class="label">this month</div>
        <div class="value" id="stat-month">₹0.00</div>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
